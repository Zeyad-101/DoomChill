<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found - DoomChill music discovery." />
  <title>DoomChill: Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="Assets/logo.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-8);
    }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--color-accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: var(--sp-3);
    }
    .notfound-headline {
      font-family: var(--font-headline);
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: var(--sp-4);
    }
    .notfound-desc {
      max-width: 460px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: var(--sp-8);
    }
    .notfound-icon {
      font-size: 3.5rem;
      margin-bottom: var(--sp-4);
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>
  <div class="notfound-wrapper">
    <div class="notfound-icon" aria-hidden="true">💽</div>
    <p class="notfound-code">404 Error</p>
    <h1 class="notfound-headline">Lost in the Sounds</h1>
    <p class="notfound-desc">The track or page you are looking for has faded into the mist. Let us take you back to the frequency.</p>
    <a href="/" class="btn-primary">Return to Music Discovery</a>
  </div>
</body>
</html>
